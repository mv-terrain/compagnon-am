<style>
:root{--bg:#f3f5f4;--surface:#fff;--line:#d5dcda;--fg:#17201f;--muted:#56615f;--accent:#0d6b62;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--surface:#18201f;--line:#2c3735;--fg:#e8eeed;--muted:#9aa7a4;--accent:#4fb8a8;--err:#f2b8b5}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:24px;margin:0;line-height:1.2}
p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center;font-size:15px}.row input{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;font-weight:600;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer;min-height:48px}
button:disabled{opacity:.6}.err{color:var(--err);font-size:14px;min-height:1.2em}
.badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00;background:#fff3d6;border-radius:6px;padding:3px 8px}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const store={get(){try{return localStorage.getItem('am-key')}catch(e){return null}},set(v){try{localStorage.setItem('am-key',v)}catch(e){}},del(){try{localStorage.removeItem('am-key')}catch(e){}}};
async function openWith(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.c));const html=new TextDecoder().decode(pt);if(document.readyState!=='complete')await new Promise(r=>window.addEventListener('load',r,{once:true}));document.open();document.write(html);document.close();}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});}
(async()=>{const k=store.get();if(!k)return;const f=document.getElementById('f');f.style.visibility='hidden';try{await openWith(await crypto.subtle.importKey('raw',b64(k),'AES-GCM',true,['decrypt']));}catch(e){store.del();f.style.visibility='';}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const go=document.getElementById('go'),err=document.getElementById('err');go.disabled=true;err.textContent='';
 try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
  await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.c));
  if(document.getElementById('rem').checked)store.set(btoa(String.fromCharCode(...raw)));
  await openWith(key);
 }catch(x){err.textContent='Mot de passe incorrect.';go.disabled=false;}});
})();
